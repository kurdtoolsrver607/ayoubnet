<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trading Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B0F17;
      color: #F1F5F9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    #trading-root {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .tr-splash {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0B0F17;
      color: #94A3B8;
      font-size: 14px;
    }
    .tr-splash-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid rgba(148, 163, 184, 0.16);
      border-top-color: #10B981;
      animation: trSpin 0.8s linear infinite;
    }
    @keyframes trSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="trading-root">
    <div class="tr-splash" aria-label="Loading">
      <div class="tr-splash-ring"></div>
      <span>Loading workspace...</span>
    </div>
  </div>

  <script>
    (function() {
      var isViteDev = (
        location.port === '3000' ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname.indexOf('run.app') !== -1 ||
        location.hostname.indexOf('aistudio') !== -1
      );

      if (!isViteDev) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = '/assets/trading.css';
        document.head.appendChild(css);
      }

      var script = document.createElement('script');
      script.type = 'module';
      script.src = isViteDev ? '/src/trading/main.tsx' : '/assets/trading.js';
      script.onerror = function() {
        if (isViteDev) {
          var cssFb = document.createElement('link');
          cssFb.rel = 'stylesheet';
          cssFb.href = '/assets/trading.css';
          document.head.appendChild(cssFb);
          var fb = document.createElement('script');
          fb.type = 'module';
          fb.src = '/assets/trading.js';
          document.body.appendChild(fb);
        }
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
