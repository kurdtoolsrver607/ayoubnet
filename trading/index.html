<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trading Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0B0F17;
      color: #F1F5F9;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    #trading-root {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    .tr-splash {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0B0F17;
      color: #94A3B8;
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }
    .tr-splash-ring {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid rgba(148, 163, 184, 0.16);
      border-top-color: #10B981;
      animation: trSpin 0.8s linear infinite;
    }
    @keyframes trSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="trading-root">
    <div class="tr-splash" aria-label="Loading">
      <div class="tr-splash-ring"></div>
      <span id="tr-splash-text">Loading workspace...</span>
    </div>
  </div>

  <script type="module">
    (function() {
      // Because type="module" scripts execute in strict document order, Vite's injected
      // React Refresh preamble in <head> has already run in dev mode (localhost & ais-dev),
      // while static production hosts (ayoubi.site & ais-pre) have no preamble.
      const isViteDev = Boolean(
        window.__vite_plugin_react_preamble_installed__ ||
        window.$RefreshReg$
      );

      function loadProductionBundle() {
        if (!document.querySelector('link[href="/assets/trading.css"]')) {
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = '/assets/trading.css';
          document.head.appendChild(css);
        }
        const prodEntry = '/assets/' + 'trading.js';
        import(/* @vite-ignore */ prodEntry).catch(function(err) {
          console.error('Failed to load production trading bundle:', err);
          const label = document.getElementById('tr-splash-text');
          if (label) {
            label.textContent = 'Unable to load trading module. Please refresh.';
          }
        });
      }

      if (isViteDev) {
        const devEntry = '/src/' + 'trading/main.tsx';
        import(/* @vite-ignore */ devEntry).catch(function(err) {
          console.warn('Dev entry load fallback to production bundle:', err);
          loadProductionBundle();
        });
      } else {
        loadProductionBundle();
      }
    })();
  </script>
</body>
</html>
